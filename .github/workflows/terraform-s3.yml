name: Terraform S3 Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            working-directory: terraform/hsr-dev
            role-to-assume: arn:aws:iam::798836978111:role/github-oidc-test
          - environment: test
            working-directory: terraform/hsr-test
            # TODO: ARN durch die tatsächliche Rolle im hsr_test-Account ersetzen,
            # sobald terraform/bootstrap dort gelaufen ist.
            role-to-assume: arn:aws:iam::<AWS_ACCOUNT_ID_TEST>:role/github-oidc-test
          - environment: prod
            working-directory: terraform/hsr-prod
            # TODO: ARN durch die tatsächliche Rolle im hsr_prod-Account ersetzen,
            # sobald terraform/bootstrap dort gelaufen ist.
            role-to-assume: arn:aws:iam::<AWS_ACCOUNT_ID_PROD>:role/github-oidc-test

    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ matrix.role-to-assume }}
          aws-region: eu-central-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve
